<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prerna — Data Analyst</title>
<meta name="description" content="Prerna — Data Analyst working in SQL, Python and Power BI. Dashboards, ML models and analytics case studies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--ink:#231640;--muted:#675A85;--lilac:#5B3AE0;--peach:#B93A12;--mint:#0A6F61;--lilacrgb:91,58,224;--peachrgb:185,58,18;--mintrgb:10,111,97;--g1:#E5DAFF;--g2:#FFE1D6;--b1:#F8F5FF;--b2:#EFE9FF;--nav:rgba(248,245,255,.82);--on:#FFFFFF;--lilac2:#9B7FFF;--peach2:#F59A78;--li:#3C2F5E;--q:#3C2F5E;--card:rgba(255,255,255,.72);--line:rgba(35,22,64,.13);--fill:rgba(35,22,64,.07);--fill2:rgba(35,22,64,.06);--codebg:rgba(35,22,64,.06);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--b2)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;background:radial-gradient(1100px 620px at 12% 4%,var(--g1) 0%,transparent 62%),radial-gradient(800px 500px at 95% 60%,var(--g2) 0%,transparent 60%),linear-gradient(var(--b1),var(--b2) 70%);background-attachment:fixed}
a{color:var(--lilac)}
:focus-visible{outline:3px solid var(--peach);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.1}
h2{font-size:clamp(1.7rem,3.4vw,2.3rem);font-weight:800;margin-bottom:8px}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.sub{color:var(--muted);max-width:60ch;margin-bottom:28px}
section{padding:64px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.btn{display:inline-block;font:inherit;font-weight:700;font-size:.95rem;border-radius:99px;padding:14px 28px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--lilac);border-color:var(--lilac);color:var(--on);box-shadow:0 8px 28px rgba(var(--lilacrgb),.28)}
.btn.sm{padding:9px 20px;font-size:.9rem}
/* nav */
.top{position:sticky;top:0;z-index:10;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-top:16px;padding-bottom:16px;max-width:1100px}
.brand{font-weight:800;font-size:1.25rem;color:var(--ink);text-decoration:none}
.brand span{color:var(--peach)}
.links{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.links a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.93rem;padding:4px 0;border-bottom:2px solid transparent}
.links a:hover,.links a[aria-current]{border-color:var(--lilac)}
.right{justify-self:end;display:flex;align-items:center;gap:16px}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:64px}
.tag{display:inline-block;font-family:var(--mono);font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac);padding:6px 16px;border-radius:99px;border:1px solid rgba(var(--lilacrgb),.4);background:rgba(var(--lilacrgb),.08);margin-bottom:22px}
h1{font-size:clamp(2.8rem,6.4vw,4.6rem);font-weight:800;line-height:1.04;margin-bottom:20px}
h1 span{background:linear-gradient(90deg,var(--lilac),var(--peach));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:1.2rem;font-weight:600;max-width:34ch;margin-bottom:16px}
.tagline{color:var(--muted);font-style:italic;font-size:.95rem;margin-bottom:32px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.viz{justify-self:end;width:min(100%,340px);aspect-ratio:1;border-radius:28px;display:grid;place-items:center;padding:14px;box-shadow:0 30px 70px rgba(var(--lilacrgb),.2)}
.viz svg{width:100%;height:100%;overflow:visible}
.bars rect{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .3s)}
@keyframes rise{to{transform:scaleY(1)}}
.curve{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.4s ease .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dotc{opacity:0;animation:pop .5s ease 2.1s forwards}
@keyframes pop{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.bars rect{transform:none;animation:none}.curve{stroke-dashoffset:0;animation:none}.dotc{opacity:1;animation:none}html{scroll-behavior:auto}}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px}
.tile{padding:22px 24px}
.tile b{display:block;font-family:var(--mono);font-size:1.9rem;font-weight:700;color:var(--lilac);line-height:1.2}
.tile b.stack{font-size:.95rem;line-height:1.5;padding-top:10px}
.tile span{display:block;color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:12px}
.jump{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:16px}
.jump a{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:18px;color:var(--ink);text-decoration:none;transition:border-color .2s,transform .2s}
.jump a:hover{border-color:var(--lilac);transform:translateY(-3px)}
.jump i{font-style:normal;font-size:1.4rem;grid-row:span 2}
.jump b{font-weight:700;font-size:.98rem}
.jump small{color:var(--muted);font-size:.78rem;line-height:1.4;grid-column:2}
/* demo + lab */
.two{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}
.demo{padding:22px}
.steps{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.steps span{font-size:.8rem;font-weight:700;padding:3px 13px;border-radius:99px;background:var(--fill);color:var(--muted)}
.steps span.on{background:var(--lilac);color:var(--on)}
.steps span.done{background:rgba(var(--mintrgb),.16);color:var(--mint)}
.demo h3{margin-bottom:12px}
.stage{min-height:232px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:.8rem}
th,td{padding:8px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--fill2);font-weight:700}
td{transition:background .9s,color .4s}
td.fx{background:rgba(var(--mintrgb),.14);color:va
